services:
  - type: web
    name: foodguard-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: |
      cd backend
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: |
      cd backend
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "foodguard-api.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://foodguard-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173"
      - key: FRONTEND_URL
        value: "https://foodguard-frontend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: WEB_CONCURRENCY
        value: "2"

  - type: static
    name: foodguard-frontend
    plan: starter
    region: oregon
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: "https://foodguard-api.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# This is the best deployment path for the app because:
# - the API is served as a proper Django web service
# - the frontend is a static React site with a public URL
# - Render provisions the live domain automatically after GitHub deployment
# - it avoids tunnel-based temporary links and gives a permanent hosted app URL
